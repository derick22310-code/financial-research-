name: Financial News Scraper

on:
  schedule:
    - cron: '0 22 * * *'   # 對應台灣 06:00 觸發 (預期 06:30 執行)
    - cron: '30 3 * * *'   # 對應台灣 11:30 觸發 (預期 12:00 執行)
    - cron: '30 9 * * *'   # 對應台灣 17:30 觸發 (預期 18:00 執行)
    - cron: '30 14 * * *'  # 對應台灣 22:30 觸發 (預期 23:00 執行)
  workflow_dispatch:

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium

      - name: Run Scraper and AI Processor
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          python ai_processor.py
